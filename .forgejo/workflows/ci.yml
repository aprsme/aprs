name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      image: docker.io/hexpm/elixir:1.20.2-erlang-29.0.3-ubuntu-resolute-20260707

    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs npm
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Restore dependency and build caches
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo

      - name: Run tests
        run: mix test
